name: Deploy React Vite App

on:
  push:
    branches:
      - main  # Set this to your default branch name
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        # Vite generates the production files in the 'dist' folder
        run: npm run build

      - name: Deploy to Nginx Folder
        run: |
          # 1. Clean the existing web root to avoid ghost files
          sudo rm -rf /var/www/html/*
          
          # 2. Copy the fresh build from 'dist' to Nginx web root
          sudo cp -r dist/* /var/www/html/
          
          # 3. Set permissions so Nginx can serve the files
          sudo chown -R www-data:www-data /var/www/html/
          sudo chmod -R 755 /var/www/html/
